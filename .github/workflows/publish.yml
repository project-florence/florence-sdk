# PyPI yayını (opsiyonel, P9/Faz F) — v* tag'ı atılınca tetiklenir.
# NOT: SDK'da tag/deploy zinciri yoktur (web/backend'de vardır); bu workflow yalnızca
# ileride elle v* tag'ı açılırsa çalışır. Tag atmadan publish edilmez.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write  # trusted publishing (PyPI OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish