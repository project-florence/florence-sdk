[project]
name = "florence-sdk"
version = "0.2.0"
description = "Florence API SDK — Python wrapper (sync+async), CLI, AI tools, MCP server and agents for the Florence platform"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Florence" },
]
keywords = ["florence", "bist", "finance", "sdk", "cli", "mcp", "trading", "investing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "mcp>=1.2",
    "fastmcp>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42",
    "textual>=0.60",
    # P1 (onaylandi): ccharts zorunlu ana bagimlilik — TUI grafikleri (Faz F).
    # v0.2.0 PyPI yayini canli; gecici path bagimliligi kaldirildi.
    "ccharts>=0.2.0",
]

[project.urls]
Repository = "https://github.com/project-florence/florence-sdk"
Issues = "https://github.com/project-florence/florence-sdk/issues"
Documentation = "https://github.com/project-florence/florence-sdk/tree/main/docs"

[project.scripts]
florence-mcp = "florence_mcp.server:main"
florence = "florence.cli.app:main"
fl = "florence.cli.app:main"

# Opsiyonel extra: haber icerik cekiminde yuksek kaliteli metin cikarimi.
# Kurulmazsa helpers stdlib html.parser fallback'i ile calisir (helpers-design.md Bolum 3.2).
[project.optional-dependencies]
news = ["trafilatura>=1.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florence", "src/florence_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120  # uzun Turkce docstring'ler icin
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test mock'lari uzun JSON satirlari icerir; satir uzunlugu testlerde aranmaz.
"tests/*" = ["E501"]
# typer CLI: Argument/Option default'larinda fonksiyon cagrisi standart typer desenidir.
"src/florence/cli/*" = ["B008"]
