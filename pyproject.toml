[project]
name = "florence-sdk"
version = "0.1.0"
description = "Florence API SDK — Python wrapper (sync+async), CLI, AI tools, MCP server and agents for the Florence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "mcp>=1.2",
    "fastmcp>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42",
]

[project.scripts]
florence-mcp = "florence_mcp.server:main"
florence = "florence.cli.app:main"
fl = "florence.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florence", "src/florence_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test mock'lari uzun JSON satirlari icerir; satir uzunlugu testlerde aranmaz.
"tests/*" = ["E501"]
# typer CLI: Argument/Option default'larinda fonksiyon cagrisi standart typer desenidir.
"src/florence/cli/*" = ["B008"]
